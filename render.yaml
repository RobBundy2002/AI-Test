services:
  - type: web
    name: sermonwise
    runtime: docker
    plan: free
    autoDeployTrigger: checksPass
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sermonwise-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: INVITE_CODE
        sync: false
databases:
  - name: sermonwise-db
    plan: free
    databaseName: sermonwise
